<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Визуализация</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    body {
        background: #12102a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 60px;
        padding: 40px;
    }

    /* Центральное тёмное окно */
    .viewport {
        width: 100%;
        max-width: 1000px;
        aspect-ratio: 16 / 9;
        background: #000000;
        border: 1px solid #3d2a6b;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 0 40px rgba(80, 40, 160, 0.15);
    }

    #canvas-container {
        width: 100%;
        height: 100%;
    }

    /* Кнопка */
    .load-btn {
        padding: 18px 48px;
        font-size: 20px;
        font-family: inherit;
        color: #1a1a1a;
        background: #ececec;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 4px 0 #b8b8b8;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .load-btn:hover {
        background: #f5f5f5;
    }

    .load-btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #b8b8b8;
    }

    /* Адаптивность */
    @media (max-width: 768px) {
        body {
            gap: 40px;
            padding: 20px;
        }

        .load-btn {
            padding: 14px 32px;
            font-size: 16px;
        }
    }
</style>
</head>
<body>

    <div class="viewport">
        <div id="canvas-container"></div>
    </div>

    <button class="load-btn">Загрузить данные</button>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');

        // Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Камера
        const camera = new THREE.PerspectiveCamera(
            50,
            container.clientWidth / container.clientHeight,
            0.1,
            1000
        );
        camera.position.z = 4;

        // Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Освещение
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        const light1 = new THREE.DirectionalLight(0x8a5cff, 2.5);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0xff5cc8, 2);
        light2.position.set(-5, -3, 4);
        scene.add(light2);

        // Сфера
        const geometry = new THREE.SphereGeometry(1.3, 64, 64);
        const material = new THREE.MeshStandardMaterial({
            color: 0x1a1440,
            metalness: 0.7,
            roughness: 0.25,
            emissive: 0x3d2a6b,
            emissiveIntensity: 0.4
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Каркас поверх сферы
        const wireframe = new THREE.Mesh(
            new THREE.SphereGeometry(1.305, 32, 32),
            new THREE.MeshBasicMaterial({
                color: 0x8a5cff,
                wireframe: true,
                transparent: true,
                opacity: 0.25
            })
        );
        scene.add(wireframe);

        // Анимация
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            sphere.rotation.y = t * 0.35;
            sphere.rotation.x = t * 0.12;
            wireframe.rotation.y = t * 0.35;
            wireframe.rotation.x = t * 0.12;

            renderer.render(scene, camera);
        }
        animate();

        // Ресайз
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
