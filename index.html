<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Земля</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
        background: #12102a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 60px;
        padding: 40px;
    }

    .viewport {
        width: 100%;
        max-width: 1000px;
        aspect-ratio: 16 / 9;
        background: #000;
        border: 1px solid #3d2a6b;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 0 40px rgba(80, 40, 160, 0.15);
    }

    #canvas-container { width: 100%; height: 100%; }

    .loader {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #8a5cff;
        font-size: 14px;
        letter-spacing: 3px;
        transition: opacity 0.5s ease;
        pointer-events: none;
        z-index: 2;
    }
    .loader.hidden { opacity: 0; }

    .load-btn {
        padding: 18px 48px;
        font-size: 20px;
        font-family: inherit;
        color: #1a1a1a;
        background: #ececec;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 4px 0 #b8b8b8;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .load-btn:hover { background: #f5f5f5; }
    .load-btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #b8b8b8;
    }

    @media (max-width: 768px) {
        body { gap: 40px; padding: 20px; }
        .load-btn { padding: 14px 32px; font-size: 16px; }
    }
</style>
</head>
<body>

    <div class="viewport">
        <div id="canvas-container"></div>
        <div class="loader" id="loader">ЗАГРУЗКА...</div>
    </div>

    <button class="load-btn">Загрузить данные</button>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const loaderEl = document.getElementById('loader');

        // Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Камера
        const camera = new THREE.PerspectiveCamera(
            50,
            container.clientWidth / container.clientHeight,
            0.1,
            1000
        );
        camera.position.z = 4;

        // Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Сфера — MeshBasicMaterial (не зависит от света)
        const geometry = new THREE.SphereGeometry(1.3, 96, 96);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const earth = new THREE.Mesh(geometry, material);
        earth.rotation.z = 0 * Math.PI / 180;
        scene.add(earth);

        // ================== Загрузка текстуры с фолбэками ==================
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        // Несколько зеркал одной и той же текстуры
        const textureUrls = [
            'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/earth_atmos_2048.jpg',
            'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
            'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/textures/planets/earth_atmos_2048.jpg'
        ];

        let urlIndex = 0;

        function tryLoadTexture() {
            if (urlIndex >= textureUrls.length) {
                loaderEl.textContent = 'НЕ УДАЛОСЬ ЗАГРУЗИТЬ ТЕКСТУРУ';
                return;
            }

            const url = textureUrls[urlIndex];
            console.log('Пробуем загрузить:', url);

            textureLoader.load(
                url,
                // onLoad
                (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                    material.map = texture;
                    material.needsUpdate = true;
                    loaderEl.classList.add('hidden');
                    console.log('Текстура загружена:', url);
                },
                // onProgress
                undefined,
                // onError
                (err) => {
                    console.warn('Не удалось загрузить', url, err);
                    urlIndex++;
                    tryLoadTexture();
                }
            );
        }

        tryLoadTexture();

        // Анимация вращения
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            earth.rotation.y = t * 0.15;
            renderer.render(scene, camera);
        }
        animate();

        // Ресайз
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
